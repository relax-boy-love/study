<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button class="button button--primary" id="open-modal-button" type="button">
        打开弹窗
    </button>

    <div class="modal-overlay" id="modal-overlay" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="modal__close" id="close-modal-button" type="button" aria-label="关闭弹窗">
                ×
            </button>

            <h2 class="modal__title" id="modal-title">
                确认删除
            </h2>

            <p class="modal__content">
                删除后无法恢复，确定继续吗？
            </p>

            <div class="modal__actions">
                <button class="button button--secondary" id="cancel-button" type="button">
                    取消
                </button>

                <button class="button button--danger" id="confirm-button" type="button">
                    确认删除
                </button>
            </div>
        </section>
    </div>

    <div class="message-region" id="message-region" aria-live="polite" aria-atomic="true"></div>
</body>

</html>

<style>
    .button {
        padding:
            var(--space-small) var(--space-medium);

        border: 0;
        border-radius: var(--radius-small);

        font: inherit;
        cursor: pointer;

        transition:
            background-color 200ms ease,
            transform 200ms ease,
            box-shadow 200ms ease;
    }

    .button:hover {
        transform: translateY(-2px);

        box-shadow:
            0 6px 16px rgb(0 0 0 / 18%);
    }

    .button:active {
        transform: translateY(0);
    }

    .button:focus-visible,
    .modal__close:focus-visible,
    .message__close:focus-visible {
        outline: 3px solid #f59e0b;
        outline-offset: 3px;
    }

    .button--primary {
        background-color: var(--color-primary);
        color: var(--color-surface);
    }

    .button--danger {
        background-color: var(--color-danger);
        color: var(--color-surface);
    }

    .button--secondary {
        border: 1px solid var(--color-border);
        background-color: var(--color-surface);
        color: var(--color-text);
    }

    :root {
        --color-primary: #2563eb;
        --color-danger: #dc2626;
        --color-surface: #ffffff;
        --color-text: #1f2937;
        --color-border: #d1d5db;

        --space-small: 8px;
        --space-medium: 16px;
        --space-large: 24px;

        --radius-small: 6px;
        --radius-large: 12px;
    }

    .button--secondary {
        border: 1px solid var(--color-border);
        background-color: var(--color-surface);
        color: var(--color-text);
    }

    .modal-overlay {
        /* 固定在视口中 */
        position: fixed;

        /* 覆盖整个视口 */
        inset: 0;

        z-index: 1000;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: var(--space-medium);
        background-color: rgb(0 0 0 / 55%);

        animation:
            overlay-fade-in 200ms ease;
    }

    /* hidden存在时必须真正隐藏 */
    .modal-overlay[hidden] {
        display: none;
    }

    .modal {
        position: relative;

        width: min(100%, 440px);
        padding: var(--space-large);

        border-radius: var(--radius-large);
        background-color: var(--color-surface);

        box-shadow:
            0 18px 50px rgb(0 0 0 / 25%);

        animation:
            modal-enter 250ms ease-out;
    }

    .modal__title {
        margin:
            0 40px var(--space-medium) 0;
    }

    .modal__content {
        margin:
            0 0 var(--space-large);
    }

    .modal__close {
        position: absolute;
        top: 12px;
        right: 12px;

        width: 36px;
        height: 36px;

        border: 0;
        border-radius: 50%;

        background-color: transparent;
        font-size: 24px;
        cursor: pointer;
    }

    .modal__actions {
        display: flex;

        /* 按钮靠右排列 */
        justify-content: flex-end;

        gap: var(--space-small);
    }

    @keyframes overlay-fade-in {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    @keyframes modal-enter {
        from {
            opacity: 0;

            transform:
                translateY(20px);
        }

        to {
            opacity: 1;

            transform:
                translateY(0px);
        }
    }

    .message-region {
        position: fixed;
        top: var(--space-medium);
        right: var(--space-medium);

        z-index: 1100;

        display: flex;
        flex-direction: column;
        gap: var(--space-small);

        width: min(calc(100% - 32px),
                360px);
    }

    .message {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-medium);

        padding: var(--space-medium);

        border-radius: var(--radius-small);
        background-color: var(--color-surface);

        box-shadow:
            0 8px 24px rgb(0 0 0 / 18%);

        animation:
            message-enter 300ms ease-out;
    }

    .message--success {
        border-left:
            5px solid #16a34a;
    }

    .message--error {
        border-left:
            5px solid var(--color-danger);
    }

    .message__content {
        margin: 0;
    }

    .message__close {
        flex: 0 0 auto;

        border: 0;
        background-color: transparent;

        font-size: 20px;
        cursor: pointer;
    }

    @keyframes message-enter {
        from {
            opacity: 0;

            /* 从右侧20px处进入 */
            transform:
                translateX(20px);
        }

        to {
            opacity: 1;

            /* 回到原来的位置 */
            transform:
                translateX(0px);
        }
    }

    @media (prefers-reduced-motion: reduce) {
    .button {
        transition: none;
    }

    .skeleton,
    .modal-overlay,
    .modal,
    .message {
        animation: none;
    }

    .skeleton {
        opacity: 0.65;
    }
}
</style>

<script>
    const openModalButton =
        document.querySelector(
            "#open-modal-button"
        );

    const closeModalButton =
        document.querySelector(
            "#close-modal-button"
        );

    const cancelButton =
        document.querySelector(
            "#cancel-button"
        );

    const modalOverlay =
        document.querySelector(
            "#modal-overlay"
        );

    function openModal() {
        modalOverlay.hidden = false;
    }

    function closeModal() {
        modalOverlay.hidden = true;
    }

    openModalButton.addEventListener(
        "click",
        openModal
    );

    closeModalButton.addEventListener(
        "click",
        closeModal
    );

    cancelButton.addEventListener(
        "click",
        closeModal
    );

    modalOverlay.addEventListener(
        "click",
        function (event) {
            if (event.target === modalOverlay) {
                closeModal();
            }
        }
    );

    document.addEventListener(
        "keydown",
        function (event) {
            if (
                event.key === "Escape" &&
                modalOverlay.hidden === false
            ) {
                closeModal();
            }
        }
    );



    const confirmButton =
        document.querySelector("#confirm-button");

    const messageRegion =
        document.querySelector("#message-region");

    function showMessage(text, type) {
        const message =
            document.createElement("div");

        message.classList.add(
            "message",
            "message--" + type
        );

        const content =
            document.createElement("p");

        content.classList.add(
            "message__content"
        );

        content.textContent = text;

        const closeButton =
            document.createElement("button");

        closeButton.classList.add(
            "message__close"
        );

        closeButton.type = "button";
        closeButton.textContent = "×";

        closeButton.setAttribute(
            "aria-label",
            "关闭消息"
        );

        message.append(
            content,
            closeButton
        );

        messageRegion.append(message);

        closeButton.addEventListener(
            "click",
            function () {
                message.remove();
            }
        );

        setTimeout(function () {
            message.remove();
        }, 3000);
    }

    confirmButton.addEventListener(
        "click",
        function () {
            closeModal();

            showMessage(
                "删除成功",
                "success"
            );
        }
    );

    // 1. modal-overlay为什么使用fixed而不是absolute？   因为点开弹窗就需要显示在整个屏幕只有fiexd可以不用管用户滚动页面

    // 2. inset: 0有什么作用？   整个视口显示

    // 3. modal为什么使用position: relative？   需要给后面的按钮定位  .modal 设置 position: relative，是为了让绝对定位的 .modal__close 以弹窗为定位参照。

    // 4. modal__close为什么使用absolute？   使用absolute定位到右上角

    // 5. hidden存在时为什么还需要
    //    .modal-overlay[hidden] { display: none; }？    同时拥有 modal-overlay 类和 hidden 属性的元素。

    // 6. overlay-fade-in与modal-enter分别控制什么？   overlay-fade-in控制外层盒子   modal-enter控制里面的内容

    // 7. 为什么弹窗的元素类都以modal__开头？   使用了bem

    // 8. 点击遮罩时，为什么要判断
    //    event.target === modalOverlay？      由于事件冒泡，点击弹窗里面的标题、正文或按钮，点击事件也会到达遮罩。 如果不判断，点击弹窗内部也可能关闭弹窗。

    // 9. 按Escape键能够关闭弹窗吗？  可以

    // 10. 开启减少动画偏好后，弹窗功能是否仍然可用？  可以。减少动画只关闭视觉动画，不会删除弹窗，也不会移除打开和关闭事件。\

    // 1. message-region为什么使用fixed？   因为message-region也需要固定在页面上

// 2. message和message--success分别负责什么样式？   message负责基础样式    message--success负责成功的样式

// 3. 为什么message--success不能完全代替message？     message--success只设置了颜色的改变

// 4. translateX(20px)表示从左侧还是右侧进入？   右进入

// 5. aria-live="polite"有什么作用？    这个区域出现了新内容，请在合适的时机向用户读出，但不要粗暴打断用户当前正在听的内容。

// 6. 为什么使用textContent设置消息，而不是innerHTML？   textContent会把内容当作普通文字显示  innerHTML浏览器会把字符串当成HTML解析

// 7. 消息可以通过哪两种方式删除？    等3秒自动删除  和点击右上角x删除

// 8. 多次调用showMessage时，消息能否排列多条？    可以

// 9. message组件的样式会不会因为类名.title而污染modal？     不会  因为使用的是message.title

// 10. 减少动画后，消息是否仍然会显示并在3秒后删除？    会


// 1. 主按钮和危险按钮是否显示不同颜色？   是

// 2. 鼠标移入按钮时是否平滑变化？   是

// 3. Tab键聚焦按钮时是否有明显轮廓？  是

// 4. 骨架屏是否循环明暗变化？   是

// 5. 点击“打开弹窗”是否显示弹窗？   是

// 6. 点击关闭按钮是否关闭弹窗？是

// 7. 点击取消是否关闭弹窗？是

// 8. 点击灰色遮罩是否关闭弹窗？是

// 9. 点击弹窗内部是否不会意外关闭？ 是

// 10. 按Escape是否关闭弹窗？ 是

// 11. 点击确认删除后是否显示成功消息？  是

// 12. 消息是否能点击×关闭？  是

// 13. 消息是否会在3秒后自动删除？  是

// 14. 连续操作时是否能显示多条消息？   是

// 15. 模拟prefers-reduced-motion: reduce后，
//     动画是否停止但功能仍然正常？     是

// 1. CSS变量解决了什么问题？   因类名css被污染的问题

// 2. BEM中的Block、Element、Modifier分别是什么？    Block：块  Element：元素 Modifier：修饰符

// 3. 把CSS拆成多个文件是否会自动隔离样式？为什么？   这些CSS规则仍然共同作用于同一个页面，并遵循同一套层叠规则。

// 4. transition和animation有什么区别？   transition：需要属性状态变化 才会变化    animation： 自动播放  可以重复

// 5. 为什么动画优先使用transform和opacity？   移动、缩放、旋转 → transform     淡入、淡出       → opacity   因为改变下面这些属性，经常会影响页面布局：width  height  浏览器可能需要重新计算元素的位置和大小，再重新绘制页面。  而下面两个属性通常更适合动画：transform   opacity

// 6. prefers-reduced-motion解决了什么问题？    “减少动态效果”  为特定用户  

// 7. 今天通过哪些方法减少了组件之间的样式污染？ 
// 使用BEM明确组件归属
// 避免 .title、.content 等过于普通的类名
// 避免使用范围过大的标签选择器
// 通用按钮基础类与修饰类分开
// 每个组件只控制自己的直接样式
// 按组件拆分CSS文件
// 使用有明确含义的CSS变量
// 减少 !important 和过深的选择器
// 弹窗通过 .modal__actions 排列按钮，不直接覆盖全部 .button
</script>
