<!-- 三栏 -->
 <div class="three-column-layout">
    <aside class="left-sidebar">左侧导航</aside>
    <main class="main-content">主要内容</main>
    <aside class="right-sidebar">相关推荐</aside>
</div>
</body>
<style>
    /* 父元素横向排列
两栏间距为 20px
侧边栏固定宽度 220px
侧边栏不能被压缩
主内容占据剩余宽度
主内容允许缩小，不能被长内容撑破布局 */
    .two-column-layout {
    display: flex;
    gap: 20px;
}

.sidebar {
    width: 220px;

    /* 不放大，也不缩小 */
    flex: 0 0 220px;
}

.content {
    /* 占据剩余空间 */
    flex: 1;

    /* 允许内容区域缩小 */
    min-width: 0;
}

/* 三栏 */
/* 左侧栏：固定180px
中间内容：占据剩余空间
右侧栏：固定240px
间距：20px */
.three-column-layout {
    display: flex;
    gap: 20px;
}

.left-sidebar {
    flex: 0 0 180px;
}

.main-content {
    flex: 1;
    min-width: 0;
}

.right-sidebar {
    flex: 0 0 240px;
}
@media (max-width: 768px) {
    .three-column-layout {
        /* 从横向排列改为纵向排列 */
        flex-direction: column;
    }

    .left-sidebar,
    .right-sidebar {
        /* 允许宽度根据内容或容器自动计算 */
        flex-basis:auto;
    }
}
