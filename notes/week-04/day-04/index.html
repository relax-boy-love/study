const node3 = {
  value: 30,
  next: null
};

const node2 = {
  value: 20,
  next: node3
};

const node1 = {
  value: 10,
  next: node2
};

const head = node1;
let current = head;

while (current !== null) {
  console.log(current.value);
  current = current.next;
}

// 1. 控制台依次输出什么？   10 20 30

// 2. 第一次循环结束后，current 指向哪个节点？  node2

// 3. 第三次循环结束后，current 是什么？  null

// 4. 为什么条件要写 current !== null？  因为 current 最终会指向 null，表示链表的末尾，循环条件需要检查 current 是否为 null，以避免访问 null 的属性。

// 5. 如果忘记写 current = current.next，会发生什么？ 这会形成死循环，浏览器页面还可能卡住




function countNodes(head) {
  let count = 0;
  let current = head;

  while (current !== null) {
    // 每经过一个节点，应该怎样修改 count？
    count++;
    // 怎样移动到下一个节点？
    current  = current.next;
  }

  return count;
}

console.log(countNodes(head));

// 1. countNodes(head) 应该返回多少？   3

// 2. 如果 head 是 null，函数应该返回多少？

// 3. 这个函数需要访问链表中的每个节点吗？ 需要

// 4. 如果链表有 n 个节点，时间复杂度是 O(1) 还是 O(n)？    O(n)
console.log(countNodes(head));
console.log(countNodes(null));

// Strict
// 跨站请求通常不携带 Cookie，限制最严格，
// 但从其他网站跳转过来时可能丢失登录状态，影响体验。

// Lax
// 允许部分跨站顶层导航携带 Cookie，
// 但通常阻止跨站子资源请求和跨站 POST 携带 Cookie。
// 安全性和可用性较平衡。

// None
// 允许跨站请求携带 Cookie，
// 适合确实需要跨站 Cookie 的场景；
// 必须同时设置 Secure。
