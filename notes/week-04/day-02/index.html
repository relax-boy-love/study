<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</body>
<script>
    // 1. 一次HTTP通信中，谁发送请求，谁返回响应？   浏览器发送请求  服务器返回响应

// 2. HTTP请求主要由哪四部分组成？     请求行 请求头 请求体 空行

// 3. GET /users?page=2 HTTP/1.1属于请求行、请求头还是请求体？   请求行

// 4. GET表示什么？   请求方法

// 5. /users?page=2表示什么？   请求目标

// 6. HTTP/1.1表示什么？   协议版本

// 7. Authorization通常属于请求行、请求头还是请求体？    请求头

// 8. POST请求提交的JSON数据通常放在哪里？    请求体

// 9. HTTP响应主要由哪四部分组成？   状态行 响应头  空行 响应体
 
// 10. HTTP/1.1 200 OK属于响应的哪个部分？    状态行

// 11. Content-Type: application/json属于什么？ 响应头

// 12. 响应体是否只能保存HTML？  不是

// 13. GET请求通常通过什么位置传递搜索或分页条件？  URL 查询参数传递筛选条件

// 14. 请求和响应中，用来描述数据格式、缓存策略等附加信息的是什么？   请求头 和响应头

// 1. 获取用户列表通常使用哪种方法？   get

// 2. 创建一个新用户通常使用哪种方法？  post

// 3. 删除ID为10的用户通常使用哪种方法？  DELETE

// 4. 完整替换ID为10的用户通常使用哪种方法？   PUT

// 5. 只修改用户的email通常使用PUT还是PATCH？  PATCH

// 6. GET的查询条件通常放在哪里？   url

// 7. POST的数据通常放在哪里？  请求体

// 8. PUT与PATCH最核心的区别是什么？  PUT完整替换   PATCH局部修改

// 9. “安全方法”是否表示使用了HTTPS加密？   不是

// 10. HTTP语义中，安全方法表示什么？   指只读取资源不修改服务器状态

// 11. 什么是幂等性？    对同一个资源执行一次和连续执行多次，服务器的最终状态相同。

// 12. 连续发送两次创建用户的POST，为什么可能不幂等？   因为会创建两条信息

// 13. DELETE执行第二次时可能返回404，为什么仍通常认为它是幂等的？   服务器最终的状态都是用户不存在

// 14. GET通常是否安全、是否幂等？   是  是

// 15. POST通常是否安全、是否幂等？  否  否

// 16. PUT通常是否幂等？    是

// 17. PATCH是否一定幂等？   不一定

// 18. 用户登录通常使用GET还是POST？为什么？   post  需要提供账号和密码 密码需要加密处理不能放在url  登录使用 POST 的主要原因是账号和密码可以放在请求体中，避免直接显示在 URL、浏览记录和部分日志里；但仍然必须使用 HTTPS。


// 1. 2xx通常表示什么？   请求成功

// 2. POST成功创建用户，更适合返回200还是201？   201

// 3. DELETE成功且没有响应体，可以返回什么状态码？   204

// 4. 收到204后，为什么不应该直接调用response.json()？   因为可能没有返回响应体没有json数据 解析失败会报错

// 5. 304表示资源不存在吗？     不是
 
// 6. 304情况下，浏览器通常使用哪里的资源内容？   本地缓存里面的

// 7. 401与403最核心的区别是什么？  401是没有认证  403是认证了没有权限

// 8. 用户未登录访问个人中心，通常更接近401还是403？   401

// 9. 用户已登录但没有管理员权限，通常更接近401还是403？  403

// 10. 用户名已经存在，通常可以使用哪个状态码？    409

// 11. 请求次数过于频繁，通常是什么状态码？429

// 12. 404属于客户端问题还是服务器内部问题？  客户端

// 13. 500表示什么？ 服务器内部出现未知错误。
 
// 14. 502、503、504属于哪一类状态码？  5xx  服务器错误

// 15. Fetch收到404时，Promise通常会自动rejected吗？   不会

// 16. 怎样让404或500进入自己的catch处理？     应该判断状态码是不是404和500 然后自己throw抛出错误

// 17. 301和302最主要的区别是什么？   301 永久移动   302是暂时移动

// 18. 状态码为200，是否就能证明返回的数据一定符合业务要求？   不一定

// 1. Accept表示客户端希望收到什么，还是当前发送的请求体是什么？收到什么

// 2. Content-Type表示什么？    发送的数据格式

// 3. 发送JSON请求体时，Content-Type通常写什么？   application/json

// 4. Authorization通常负责什么？      提供身份凭据

// 5. Token放在Authorization中是否代表它已经被加密？  不代表

// 6. 浏览器向服务器发送Cookie使用哪个请求头？   Cookie

// 7. 服务器要求浏览器保存Cookie使用哪个响应头？  Set-Cookie

// 8. Location经常与哪一类状态码一起使用？   3xx重定向状态码

// 9. Content-Length通常使用什么单位？   字节

// 10. Cache-Control主要负责什么？   控制缓存行为

// 11. Expires使用相对秒数还是绝对时间表示过期？绝对时间

// 12. ETag通常由客户端生成还是服务器提供？ 服务器

// 13. 客户端下次把ETag放在哪个请求头中？   If-None-Match

// 14. Last-Modified表示什么？   资源最后修改时间

// 15. 客户端下次把Last-Modified的值放在哪个请求头中？  If-Modified-Since

// 16. 协商后资源没有变化，服务器通常返回200还是304？   304

// 17. 协商后资源已经变化，服务器通常返回什么并发送什么？  200 发送响应体

// 18. Accept与Content-Type最核心的区别是什么？   Accept客户端想要接收的数据类型     Content-Type  当前发送的数据类型


// 1. 强缓存命中时，是否需要先向服务器验证？  不需要

// 2. 协商缓存是否会向服务器发送请求？  是

// 3. Cache-Control: max-age=3600表示什么？   表示3600秒之内使用缓存 

// 4. no-cache表示完全不保存缓存吗？   不是

// 5. no-store表示什么？  不存储该响应缓存

// 6. no-cache与no-store最核心的区别是什么？  no-cache是可以保存缓存需要向服务器验证    no-store 不允许保存缓存

// 7. public与private主要限制什么类型的缓存？   共享

// 8. 文件名带内容哈希的静态资源为什么适合长期缓存？  内容改变时文件名也改变，因此适合长期缓存

// 9. immutable表示什么？       表示资源在有效期内不会改变

// 10. Cache-Control和Expires同时存在时，现代浏览器通常优先使用谁？     Cache-Control

// 11. memory cache与disk cache描述的是缓存策略，还是存储位置？   存储位置

// 12. 响应中的ETag会在下次请求中放入哪个请求头？   If-None-Match

// 13. 响应中的Last-Modified会在下次请求中放入哪个请求头？  If-Modified-Since

// 14. 协商后资源未变化，服务器返回什么状态码？   304

// 15. 304响应是否需要重新发送完整响应体？   不需要

// 16. 协商后资源发生变化，通常返回什么状态码？   200 

// 17. 看到“200 (from memory cache)”说明更可能命中了什么？   强缓存  资源来自内存

// 18. 看到304和If-None-Match说明发生了什么？     协商缓存  服务器确认资源未变化，浏览器复用本地响应体

// 19. 为什么304也能显示完整页面或完整资源？   因为资源没有变化浏览器复用本地响应体

// 20. 强缓存与协商缓存的核心区别是什么？  强缓存不需要向服务器发送请求  协商需要向服务器发送请求

// Status Code: 200 OK
// Cache-Control: public, max-age=3600
// Size: (memory cache)


// Status Code: 304 Not Modified
// Request Headers:
// If-None-Match: "style-v1"

// Response Headers:
// ETag: "style-v1"
// Cache-Control: no-cache


// Status Code: 200 OK
// Request Headers:
// If-None-Match: "script-v1"

// Response Headers:
// ETag: "script-v2"
// Cache-Control: no-cache


// Status Code: 200 OK
// Response Headers:
// Cache-Control: no-store

// 1. 场景一属于强缓存还是协商缓存？强缓存

// 2. 场景一为什么不需要向服务器验证？   因为使用的是强缓存max-age

// 3. 场景一的资源来自哪里？  内存

// 4. 场景二属于强缓存还是协商缓存？  协商缓存

// 5. 哪个请求头说明浏览器把旧ETag交给了服务器？  If-None-Match: "style-v1"

// 6. 场景二为什么返回304？ 服务器判断资源没有改变所以可以使用缓存返回304

// 7. 304没有完整响应体，浏览器怎样得到资源内容？   从缓存中获得

// 8. 场景三为什么返回200而不是304？  因为资源改变了  重新请求了

// 9. 场景三最终使用旧缓存还是新响应体？  新响应体

// 10. 场景四在下次访问时为什么还要重新下载？    Cache-Control: no-store  no-store是不允许缓存

// 11. no-cache和no-store分别是什么意思？  no-cache是允许缓存 但是需要向服务器确认  no-store是不允许缓存

// 12. 强缓存与协商缓存最核心的区别是什么？  强缓存不需要向服务器发信息 协商缓存需要

// 13. GET、POST、PUT、PATCH、DELETE分别用于什么？  GET获取资源  POST创建或提交操作  PUT完整替换  PATCH局部修改 DELETE删除资源

// 14. 看到一个资源来自缓存时，你会在Network中依次检查哪些信息？  请求头max-age  请求头Cache-Control  响应体ETag  请求头If-None-Match  响应体Last-Modified 请求头If-Modified-Since

// 15. 请根据下面的响应头完整判断缓存行为：

// Cache-Control: private, max-age=600
// ETag: "user-v1"

// 前600秒内怎样处理？   强缓存 不需要给服务器确认 直接使用缓存
// 600秒过期以后怎样处理？  看请求头是否有If-None-Match
// 资源未改变时服务器返回什么？  304
// 资源改变时服务器返回什么？  200
</script>
