        async function loadUsers() {
            // 请求开始：显示加载状态
            statusMessage.textContent = "正在加载用户……";

            // 避免加载期间重复点击
            loadButton.disabled = true;

            // 清空上一次的列表
            userList.innerHTML = "";

            try {
                const response = await fetch(
                    "https://dummyjson.com/users?limit=5"
                );

                if (!response.ok) {
                    throw new Error(
                        "请求失败，状态码：" + response.status
                    );
                }

                const data = await response.json();
                const users = data.users;

                // 判断是否为空数组
                if (users.length === 0) {
                    // 设置空数据提示
                    statusMessage.textContent = "空数据";

                    // 空数据后不需要继续渲染
                    return;
                }

                users.forEach(function (user) {
                    const userItem = document.createElement("li");

                    userItem.textContent =
                        user.firstName +
                        " " +
                        user.lastName +
                        " - " +
                        user.email;

                    userList.append(userItem);
                });

                // 所有用户渲染完成后显示成功状态
                statusMessage.textContent = "成功加载" + users.length + "名用户";

            } catch (error) {
                // 错误状态
                statusMessage.textContent = error.message;

                // 保证错误时不展示旧数据
                userList.innerHTML = "";

            } finally {
                // 无论成功、空数据或失败，都恢复按钮
                /* 你来填写 */
                loadButton.disabled = false;
            }
        }

        let currentController = null;

        async function searchUsers(keyword, delay) {
            // 如果存在上一次请求的控制器，取消上一次请求
            if (currentController !== null) {
                // 1. 取消旧请求
                currentController.abort();
            }

            // 2. 为本次请求创建新控制器
            const controller = new AbortController();

            // 保存为当前控制器
            currentController = controller;

            statusMessage.textContent =
                "正在搜索：" + keyword;

            try {
                const url =
                    "https://dummyjson.com/users/search?q=" +
                    encodeURIComponent(keyword) +
                    "&delay=" +
                    delay;

                // 3. 把本次控制器的signal传给fetch
                const response = await fetch(url, {
                    signal: controller.signal
                });

                if (!response.ok) {
                    throw new Error(
                        "请求失败，状态码：" + response.status
                    );
                }

                const data = await response.json();
                const users = data.users;

                // 额外保险：只有当前最新请求可以更新页面
                if (controller !== currentController) {
                    return;
                }

                userList.innerHTML = "";

                if (users.length === 0) {
                    statusMessage.textContent = "暂无搜索结果";
                    return;
                }

                users.forEach(function (user) {
                    const userItem = document.createElement("li");

                    userItem.textContent =
                        user.firstName + " " + user.lastName;

                    userList.append(userItem);
                });

                statusMessage.textContent =
                    keyword + "搜索完成";

            } catch (error) {
                // 4. 如果是主动取消产生的错误，安静地结束函数
                if (error.name === "AbortError") {
                    console.log(keyword + "请求已取消");
                    return;
                }
                if (controller !== currentController) {
                    return;
                }

                // 真正的请求错误才展示给用户
                statusMessage.textContent =
                    "搜索失败：" + error.message;
            }
            finally {
                if (controller === currentController) {
                    currentController = null;
                }
            }
        }

        searchButton.addEventListener("click", function () {

            if (keyword === "") {

                userList.innerHTML = "";
                return;
            }

            // 使用2秒延迟，方便观察连续搜索和取消请求
            searchUsers(keyword, 2000);
        });

        // 1. currentController为什么必须定义在函数外面？  如果定义在里面 每次请求会新创建一个所以之前那个就没有了 之前那个请求没有中断还在执行

        // 3. 为什么要先abort旧控制器，再创建新控制器？   因为保存控制器的是同一个必须把之前的处理了才能进行新保存

        // 7. controller !== currentController说明当前函数属于最新请求还是旧请求？  旧请求


        cancelButton.addEventListener("click", function () {
            // 1. 判断当前是否存在请求控制器
            if (currentController) {
                // 2. 取消当前请求
                currentController.abort();

                // 3. 清空当前控制器
                currentController = null;

                // 4. 更新页面提示
                statusMessage.textContent = "请求已取消";
            }
        });

        // 1. 正常搜索是否能够显示成功结果？   是
