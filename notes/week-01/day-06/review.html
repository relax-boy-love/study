                                            arr.push()

│

        console.log(typeof []);         //object
        console.log(typeof null);       //object
        console.log(typeof NaN);        //number
        console.log(Array.isArray({})); //false
        console.log(Number.isNaN("hello"));//false

        console.log(Number(""));      //0
        console.log(Number("hello")); // NaN
        console.log(Boolean("0"));  // true
        console.log(1 + true);  //  2 因为true默认值是1
        console.log("10" - null);// 10  null =0

        var value = 10;

        function test() {
            console.log(value);
            var value = 20;
            console.log(value);
        }

        test();
        console.log(value);
        // 三个console.log分别输出什么？ undefined 20 10
        // 为什么函数中的第一次输出不是10？ 因为var有声明提升并且是undefined   在自身作用域中先找自身在找全局


        function createStepCounter(step) {
            let count = 0;

            return function () {
                count += step;
                return count;
            };
        }

        const counterA = createStepCounter(2);
        const counterB = createStepCounter(5);

        console.log(counterA()); //2
        console.log(counterA()); //4
        console.log(counterB()); //5
        console.log(counterA()); //6
        console.log(counterB()); //10
        // counterA和counterB创建独立的函数域
        "use strict";

        const user = {
            name: "小明",

            showName() {
                return this.name;
            }
        };

        const show = user.showName;

        console.log(user.showName());
        console.log(show());
        // 第一次输出什么？   小明
        // 第二次执行会输出什么或发生什么？   应该没有输出 控制台会报错
        // 两次调用中的this分别指向谁？   第一次this指向user 第二次指向属于普通函数直接调用undefined



        function uniqueArray(arr) {
            const result = [];

            for (let i = 0; i < arr.length; i++) {
                if (result.indexOf(arr[i]) === -1) {
                    result.push(arr[i])
                }
            }

            return result;
        }
        console.log(uniqueArray([1, 2, 1, 3, 2, 4]));

        // score 从高到低。
        // 分数相同时，age 从小到大。
        // 不修改原数组。

        const students = [
            { name: "小明", score: 80, age: 20 },
            { name: "小红", score: 95, age: 21 },
            { name: "小刚", score: 80, age: 18 }
        ];

        function sortStudents(students) {
            const res = [...students];

            // 完成代码
            res.sort(function (a, b) {
                if (a.score === b.score) {
                    return a.age - b.age
                } else {
                    return b.score - a.score
                }
            })
            return res;
        }
        console.log(sortStudents(students))


        function once(fn) {
            let hasRun = false;
            let result;

            return function (...args) {
                // 补全
                if (hasRun === false) {
                    result = fn(...args)
                    hasRun = true;
                }
                return result;
            };
        }

        function add(a, b) {
            console.log("执行了add");
            return a + b;
        }

        const addOnce = once(add);

        console.log(addOnce(1, 2));
        console.log(addOnce(10, 20));

        // “执行了add”会打印几次？        1
        // 两个console.log分别输出什么？ 3 3

        function introduce(greeting, city) {
            return greeting + "，我是" + this.name + "，来自" + city;
        }

        const userA = { name: "小明" };

        const resultA = introduce.call(userA, "你好", "上海");
        const resultB = introduce.apply(userA, ["早上好", "北京"]);
        const bound = introduce.bind(userA, "欢迎");
        const resultC = bound("广州");
        // resultA：你好，我是小明，来自上海
        // resultB：早上好，我是小明，来自北京
        // resultC：欢迎，我是小明，来自广州

        // 哪两个方法立即执行原函数？ call apply
        // 哪个方法返回新函数？ bind
        // bind提前传入了哪个参数？greeting

        function User(name) {
            this.name = name;
        }

        User.prototype.sayHello = function () {
            return "你好，我是" + this.name;
        };

        const userB = new User("小红");

        console.log(userB.hasOwnProperty("name"));  //true
        console.log(userB.hasOwnProperty("sayHello")); // false
        console.log("sayHello" in userB);  //true
        console.log(userB.__proto__ === User.prototype); //true
        console.log(User.prototype.__proto__ === Object.prototype); // true
        // userB
        //   ↓__proto__
        // User.prototype
        //   ↓__proto__
        // Object.prototype
        //   ↓__proto__
        // null


        function countCharacters(str) {
            const newStr = str.toLowerCase();
            const result = {};
            for (var i = 0; i < newStr.length; i++) {
                if (newStr[i] === " ") {
                    continue;
                }
                if (result[newStr[i]] === undefined) {
                    result[newStr[i]] = 1;
                } else {
                    result[newStr[i]]++;
                }


            }
            // 忽略空格
            // 不区分大小写
            // 统计每个字符出现次数

            return result;
        }

        console.log(countCharacters("Hello JS"));



        // 点击 +1，数字增加 1。
        // 点击“重置”，数字恢复为 0。
        // 使用一个 render() 函数统一更新页面。
        // 不要在两个事件中重复写 countElement.textContent = count。
        const increaseButton = document.querySelector("#increase");
        const resetButton = document.querySelector("#reset");
        const countElement = document.querySelector("#count");

        let count = 0;

        // 继续完成
        increaseButton.addEventListener("click", function () {
            count++;
            render();
        });
        resetButton.addEventListener("click", function () {
            count = 0;
            render();
        });

        function render() {
            countElement.textContent = count;
        }



        class ReviewUser {
            constructor(name) {
                this.name = name;
            }

            introduce() {
                return "我是" + this.name;
            }
        }

        class ReviewAdmin extends ReviewUser {
            constructor(name, role) {
                // 补全
                super(name);
                this.role = role;
            }

            manage() {
                return this.name + "正在管理系统";
            }
        }

        const reviewAdmin = new ReviewAdmin("小明", "超级管理员");
        console.log(reviewAdmin.name);            //小明
        console.log(reviewAdmin.role);            //超级管理员
        console.log(reviewAdmin.introduce());     //我是小明
        console.log(reviewAdmin.manage());        //小明正在管理系统
        console.log(reviewAdmin.hasOwnProperty("introduce")); //false
        console.log(reviewAdmin instanceof ReviewUser);    // true


        function myNew(Constructor, ...args) {
            // 创建对象，并连接Constructor.prototype
            const newObject = Object.create(Constructor.prototype);

            // 执行构造函数，让this指向新对象
            const result = Constructor.call(newObject, ...args);

            // 判断构造函数是否主动返回了对象或函数
            const isObject =
                result !== null &&
                (typeof result === "object" || typeof result === "function");

            if (isObject) {
                return result;
            }

            return newObject;
        }
        // Object.create负责什么？  Object.create负责连接Constructor的原型
        // call负责什么？            call负责让this指向newObject对象

        function myInstanceof(object, Constructor) {
            // 从实例的直接原型开始
            let currentPrototype = Object.getPrototypeOf(object);

            // 需要寻找的目标
            const targetPrototype = Constructor.prototype;

            while (currentPrototype !== null) {
                if (currentPrototype === targetPrototype) {
                    return true;
                }

                // 向原型链上一层移动
                currentPrototype = Object.getPrototypeOf(currentPrototype);
            }

            return false;
        }
        // myInstanceof在原型链中寻找什么？ Constructor的原型是否在原型链上

        // 到达null仍然没有找到，说明什么？  Constructor的原型没有在原型链上
