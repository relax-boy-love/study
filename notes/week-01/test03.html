        function createCounter() {
            let count = 0;

            return function () {
                count++;
                return count;
            };
        }

        // 全局作用域

        // counterA指向：countA

        // 计算器



        function createCounter(initialValue) {
            let count = initialValue;

            return {
                increment: function () {
                    // count增加1并返回
                    count++;
                    return count
                },

                decrement: function () {
                    // count减少1并返回
                    count--;
                    return count
                },

                getValue: function () {
                    // 不修改count，只返回当前值
                    return count
                },

                reset: function () {
                    count = initialValue;
                    return count
                }
            };
        }
        const counter = createCounter(10);

        console.log(counter.getValue());
        console.log(counter.increment());
        console.log(counter.increment());
        console.log(counter.decrement());
        console.log(counter.reset());
        console.log(counter.getValue());


        function once(fn) {
            // 变量1：记录fn是否执行过
            // 变量2：保存第一次执行的结果
            let hasRun = false;
            let reuslt;

            return function (...args) {
                // 如果没有执行过：
                if (hasRun === false) {
                    reuslt = fn(...args);
                    hasRun = true;
                }
                // 1. 调用fn
                // 2. 传入args
                // 3. 保存结果
                // 4. 修改执行状态

                // 返回第一次保存的结果
                return reuslt
            };
        }

        function pay(amount) {
            console.log("支付了：" + amount);
            return "支付成功";
        }

        const payOnce = once(pay);

        console.log(payOnce(100));
        console.log(payOnce(200));
        console.log(payOnce(300));

        // pay()只执行一次
        // "支付了：100"只打印一次
        // 后两次不能再次支付
        // 三次调用都返回第一次执行结果
        // 不使用全局变量


        function memoize(fn) {
            const cache = {};

            return function (number) {

                if (cache[number] === undefined) {
                    cache[number] = fn(number);
                }

                return cache[number]
                // 第一步：检查cache中是否已经保存number对应的结果

                // 如果存在，直接返回缓存结果

                // 如果不存在，执行fn(number)

                // 将计算结果保存在cache[number]中

                // 返回计算结果
            };
        }

        function calculateSquare(number) {
            console.log("正在计算：" + number);
            return number * number;
        }

        const cachedSquare = memoize(calculateSquare);

        console.log(cachedSquare(5));
        console.log(cachedSquare(5));
        console.log(cachedSquare(6));
        console.log(cachedSquare(5));

        
        // 闭包练习	             返回到外部的内容	        闭包需要保存什么
        // createCounter	    包含四个方法的对象	       count和重置所需的数据
        // once	                包装后的新函数	           原函数、执行状态、首次结果
        // memoize	            带缓存功能的新函数	       原函数和缓存对象

        // 什么是作用域链？                             先找自己作用域的在找外层在找全局
        // var、let和const在提升方面有什么区别？        三者的声明都会被JavaScript提前处理，但表现不同：
                                                        // var：声明提升，并初始化成undefined
                                                        // let：声明提升，但初始化前处于暂时性死区
                                                        // const：声明提升，但初始化前处于暂时性死区
        // 什么是暂时性死区？                          从当前作用域开始→ 一直到let或const声明语句执行完成

        // 两次调用createCounter()为什么产生独立计数？  因为它创建了不同的实列
        // once为什么需要保存执行状态和第一次结果？      因为害怕重复点击多次执行
        // memoize为什么能够避免重复计算？              因为它会先去匹配之前是否有计算 如果有直接返回结果

        // 什么情况下缓存函数可能造成内存问题？          不断传入不同参数  缓存持续增长  缓存没有数量限制  缓存没有过期时间  不需要缓存后仍然保留包装函数
